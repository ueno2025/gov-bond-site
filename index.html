<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>個人向け国債金利推移サイト</title>
</head>

<body>
    <main>

        <h1>固定5年の金利推移</h1>

    <div class="chart-options">
        <label>
            <input type="checkbox" value="baseRate" checked>
            基準金利
        </label>

        <label>
            <input type="checkbox" value="taxBefore" checked>
            利率（税引前）
        </label>

        <label>
            <input type="checkbox" value="taxAfter" checked>
            利率（税引後）
        </label>
    </div>

    <canvas id="interest-chart"></canvas>

        <table>
            <thead>
                <tr>
                    <th>募集月</th>
                    <th>基準金利</th>
                    <th>利率（税引前）</th>
                    <th>利率（税引後）</th>
                </tr>
            </thead>

            <tbody id="table-body">
            </tbody>
        </table>

    </main>

    <script src="js/script.js"></script>
</body>

</html>
